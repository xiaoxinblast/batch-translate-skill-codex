name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install PyYAML tomli
      - run: python -m unittest discover -s tests
      - run: python -X utf8 scripts/quick_validate.py batch-translate
      - run: python -c "import yaml, pathlib; yaml.safe_load((pathlib.Path('batch-translate') / 'agents' / 'openai.yaml').read_text(encoding='utf-8'))"
